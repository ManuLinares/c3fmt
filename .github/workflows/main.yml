name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  C3_BASE_URL: https://github.com/c3lang/c3c/releases/download/latest-prerelease-tag

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install C3 compiler
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL -o c3.tar.gz $C3_BASE_URL/c3-linux.tar.gz
              tar -xzf c3.tar.gz ;;
            macOS)
              curl -fsSL -o c3.zip $C3_BASE_URL/c3-macos.zip
              tar -xf c3.zip ;;
            Windows)
              curl -fsSL -o c3.zip $C3_BASE_URL/c3-windows.zip
              unzip -q c3.zip ;;
          esac
          echo "$PWD/c3" >> $GITHUB_PATH

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action@v2
        with:
          install-lib: true
          install-cli: false

      - name: Run tests
        run: c3c test --test-show-output -L "${{ runner.tool_cache }}/tree-sitter/lib/lib"

      - name: Compile formatted standard library
        working-directory: test/stdlib
        run: c3c build

      - name: Build c3fmt
        run: c3c build c3fmt -L "${{ runner.tool_cache }}/tree-sitter/lib/lib"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: c3fmt-linux
          path: build/c3fmt

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: c3fmt-macos
          path: build/c3fmt

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: c3fmt-windows
          path: build/c3fmt.exe

  release:
    name: Create Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v6
        with:
          name: c3fmt-linux
          path: release-bin/linux

      - name: Download macOS binary
        uses: actions/download-artifact@v6
        with:
          name: c3fmt-macos
          path: release-bin/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v6
        with:
          name: c3fmt-windows
          path: release-bin/windows

      - name: Prepare files for release
        run: |
          mkdir dist
          mv release-bin/linux/c3fmt dist/c3fmt-linux
          mv release-bin/macos/c3fmt dist/c3fmt-macos
          mv release-bin/windows/c3fmt.exe dist/c3fmt-windows.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
